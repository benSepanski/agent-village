name: agent-village

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: agent-village-localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=dynamodb,secretsmanager,events,scheduler,sns,sqs,iam,sts,s3,logs,cloudwatch,cognito-idp,cognito-identity,apigateway,lambda
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
      - LOCALSTACK_HOST=localhost
      - PERSISTENCE=1
    volumes:
      - ./.localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 30

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    container_name: agent-village-ddb
    ports:
      - '8000:8000'
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/data']
    volumes:
      - ./.dynamodb-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'exit 0']
      interval: 5s
      timeout: 5s
      retries: 3
