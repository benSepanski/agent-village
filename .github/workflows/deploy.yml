name: Deploy

# Deploy-to-dev runs only when the repo variable AV_DEPLOY_DEV_ENABLED is set
# to "true" (Settings → Secrets and variables → Actions → Variables → New variable).
# Keep it unset until the AWS OIDC role (secret AWS_DEPLOY_ROLE_DEV) has been
# created — otherwise the job fails at credential load. Skipped jobs show grey
# on the run history instead of red, so this gate keeps the badge clean.
# Deploy-to-prod is unchanged (tag-triggered + GitHub `prod` environment approval).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AV_DEPLOY_DEV_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # VITE_* vars bake the Cognito/API config into the built SPA bundle at
      # build time (Vite inlines import.meta.env at compile time, not at
      # runtime). Without these the bundle ships with no auth/API config.
      # First deploy of a fresh env has no pool id yet — see the
      # chicken-and-egg note in packages/infra/src/stacks/web-stack.ts and
      # docs/playbooks/deploy-env.md (or: deploy -auth/-api first, populate
      # these secrets from their outputs, then re-run with AV_DEPLOY_WEB=1 to
      # ship the real bundle on deploy #2).
      - name: Build
        run: pnpm build
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID_DEV }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID_DEV }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN_DEV }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_DEV }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: us-east-1

      # AV_DEPLOY_WEB=1 makes WebStack refuse to ship the placeholder page:
      # it throws if packages/web/dist is missing instead of silently
      # deploying an empty SPA. `pnpm build` above always produces a dist,
      # so this only fires if the build step was skipped.
      - name: CDK deploy
        run: pnpm --filter @agent-village/infra deploy:dev
        env:
          AV_DEPLOY_WEB: '1'

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The sandbox task definition is ARM64 and resolves the :latest tag at
      # RunTask time, so pushing after CDK deploy is safe (the ECR repo must
      # exist first). provenance:false keeps ECR free of untagged attestation
      # manifests that would eat into the repo's maxImageCount lifecycle rule.
      - name: Build and push sandbox base image
        uses: docker/build-push-action@v6
        with:
          context: packages/infra/sandbox-image
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-village-dev-sandbox-base:latest
            ${{ steps.ecr.outputs.registry }}/agent-village-dev-sandbox-base:${{ github.sha }}

      # Per-run egress-proxy sidecar image (ADR 0003). Same ARM64 + :latest
      # resolve-at-RunTime posture as the base image; the ECR repo is created by
      # the SandboxStack in the CDK deploy step above.
      - name: Build and push egress-proxy image
        uses: docker/build-push-action@v6
        with:
          context: packages/infra/proxy-image
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-village-dev-egress-proxy:latest
            ${{ steps.ecr.outputs.registry }}/agent-village-dev-egress-proxy:${{ github.sha }}

      - name: Smoke E2E
        env:
          AV_E2E_BASE_URL: ${{ secrets.AV_DEV_URL }}
          AV_E2E_NO_SERVER: '1'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

  deploy-prod:
    name: Deploy to prod
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod # GitHub environment with required reviewer protection rule
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # VITE_* vars bake the Cognito/API config into the built SPA bundle at
      # build time (Vite inlines import.meta.env at compile time, not at
      # runtime). Without these the bundle ships with no auth/API config.
      - name: Build
        run: pnpm build
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID_PROD }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID_PROD }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN_PROD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: us-east-1

      # AV_DEPLOY_WEB=1 makes WebStack refuse to ship the placeholder page:
      # it throws if packages/web/dist is missing instead of silently
      # deploying an empty SPA. `pnpm build` above always produces a dist,
      # so this only fires if the build step was skipped.
      - name: CDK deploy
        # AV_PROD_ACCOUNT_ID (repo variable) pins the prod account — CDK refuses
        # to deploy if the assumed role belongs to a different account.
        env:
          AV_PROD_ACCOUNT_ID: ${{ vars.AV_PROD_ACCOUNT_ID }}
          AV_DEPLOY_WEB: '1'
        run: pnpm --filter @agent-village/infra deploy:prod -- --require-approval never

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sandbox base image
        uses: docker/build-push-action@v6
        with:
          context: packages/infra/sandbox-image
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-village-prod-sandbox-base:latest
            ${{ steps.ecr.outputs.registry }}/agent-village-prod-sandbox-base:${{ github.sha }}

      # Per-run egress-proxy sidecar image (ADR 0003).
      - name: Build and push egress-proxy image
        uses: docker/build-push-action@v6
        with:
          context: packages/infra/proxy-image
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-village-prod-egress-proxy:latest
            ${{ steps.ecr.outputs.registry }}/agent-village-prod-egress-proxy:${{ github.sha }}

      - name: Smoke E2E
        env:
          AV_E2E_BASE_URL: ${{ secrets.AV_PROD_URL }}
          AV_E2E_NO_SERVER: '1'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
